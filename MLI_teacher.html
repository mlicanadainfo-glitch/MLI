<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLI 师资介绍</title>
<style>
:root{
  --bg:#f6f3ee;--paper:#fffdf9;--ink:#1f2328;--sub:#5b6168;--faint:#8a9097;--line:#e4ddd2;
  --accent:#1d7fae;--accent-soft:#e1f1f9;--teal:#2e8a68;--teal-soft:#e2f2ea;--gold:#8a6a1f;--gold-soft:#f4ecd6;
  --chip:#efe9df;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181a;--paper:#202124;--ink:#ece7df;--sub:#b3ada4;--faint:#8b867f;--line:#34353a;
  --accent:#6cc3ec;--accent-soft:#1d3240;--teal:#86cfa8;--teal-soft:#1d3329;--gold:#d8b964;--gold-soft:#3a3220;--chip:#2b2c30;}}
:root[data-theme="dark"]{--bg:#17181a;--paper:#202124;--ink:#ece7df;--sub:#b3ada4;--faint:#8b867f;--line:#34353a;
  --accent:#6cc3ec;--accent-soft:#1d3240;--teal:#86cfa8;--teal-soft:#1d3329;--gold:#d8b964;--gold-soft:#3a3220;--chip:#2b2c30;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:36px 20px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px 32px;border-bottom:2px solid var(--ink);padding-bottom:18px}
header .logo{height:74px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header .logo{background:#fff;border-radius:8px;padding:4px 8px}}
h1{font-family:"Songti SC","Noto Serif SC","STSong",serif;font-size:34px;letter-spacing:.06em;margin:0;line-height:1.15}
h1 small{display:block;font:500 13px/1.4 system-ui,sans-serif;letter-spacing:.14em;color:var(--accent);margin-bottom:6px}
.asof{color:var(--faint);font-size:13px;margin-left:auto}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:22px 0 6px}
.stat b{display:block;font-family:"Songti SC","Noto Serif SC",serif;font-size:28px;line-height:1.1}
.stat span{color:var(--sub);font-size:12.5px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 22px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
.ctrl input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:8px 12px;font:inherit;font-size:13.5px;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.years{display:flex;gap:0;border-bottom:1px solid var(--line);margin:22px 0 0;overflow-x:auto}
.years button{border:0;background:none;padding:10px 16px 9px;font:inherit;font-size:15px;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.years button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.years button span{font-size:12px;color:var(--faint);margin-left:4px}
.ysec{grid-column:1/-1;font-family:"Songti SC","Noto Serif SC",serif;font-size:20px;margin:10px 0 -4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.ysec span{font:13px system-ui,sans-serif;color:var(--faint);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card.off{opacity:.88}
.card.off .mono img{filter:grayscale(.6)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:14px;align-items:flex-start}
.mono{flex:none;width:72px;height:72px;overflow:hidden;border-radius:50%;display:grid;place-items:center;font:600 18px/1 "Songti SC","Noto Serif SC",serif;background:var(--accent-soft);color:var(--accent)}
.mono.zh{background:var(--teal-soft);color:var(--teal)}
.mono img{width:100%;height:100%;object-fit:cover;display:block}
.mono:not(:has(img)){font-size:24px}
.nm{font-size:19px;font-weight:700;line-height:1.25}
.full{color:var(--faint);font-size:12.5px}
.join{margin-left:auto;text-align:right;flex:none}
.join b{display:block;font-size:14px}
.join span{font-size:12px;color:var(--faint)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.tag.zh{background:var(--teal-soft);color:var(--teal)}
.tag.fr{background:var(--accent-soft);color:var(--accent)}
.tag.cert{background:var(--gold-soft);color:var(--gold)}
dl{margin:0;display:grid;grid-template-columns:4.6em 1fr;gap:4px 10px;font-size:13.5px}
dt{color:var(--faint)}
dd{margin:0;color:var(--ink)}
.cls{border-top:1px dashed var(--line);padding-top:10px}
.cls h4{margin:0 0 6px;font-size:12.5px;color:var(--faint);font-weight:600;letter-spacing:.06em}
.c{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--chip);font-size:13.5px}
.c:last-child{border-bottom:0}
.c .code{font-weight:700;font-variant-numeric:tabular-nums}
.c .lv{color:var(--accent);font-weight:600}
.c .meta{color:var(--sub);font-size:12.5px;width:100%}
.none{color:var(--faint);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--faint)}
footer{margin-top:30px;color:var(--faint);font-size:12.5px}
@media (max-width:420px){.grid{grid-template-columns:1fr}h1{font-size:28px}.top{flex-wrap:wrap}.join{margin-left:86px;text-align:left;flex:1 1 100%;max-width:calc(100% - 86px)}.join b,.join span{display:inline;margin-right:6px}}
@media print{.ctrl{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>

<script>
const T=JSON.parse(document.getElementById('data').textContent);
const TODAY=new Date('2026-10-08');
const st={q:'',type:'',camp:'',sort:'join',year:'',act:'1'};
const ACT=T.filter(t=>t.active);
const yearOf=j=>{if(!j)return '未知';if(j.startsWith('<'))return '2023 年以前';const y=+j.replace('≤','').slice(0,4);return y<2023?'2023 年以前':y+' 年';};
const YEARS=[...new Set(T.map(t=>yearOf(t.join)))].sort((a,b)=>(a==='未知')-(b==='未知')||(a.includes('以前')?-1:b.includes('以前')?1:a.localeCompare(b)));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function joinTxt(j){if(!j)return ['—',''];if(j.startsWith('<'))return [j.slice(1)+' 年以前','资深老师'];if(j.startsWith('≤'))return ['2026 年 1 月或更早',''];
  const [y,m]=j.split('-');if(!m)return [y+' 年',''];
  const mo=(TODAY.getFullYear()-+y)*12+(TODAY.getMonth()+1-+m);const yy=Math.floor(mo/12),mm=mo%12;
  return [`${y} 年 ${+m} 月`,mo<1?'本月加入':[yy?yy+' 年':'',mm?mm+' 个月':''].filter(Boolean).join(' ')];}
function joinKey(j){if(!j)return '9999';if(j.startsWith('<'))return '0000';return j.replace('≤','').padEnd(7,'-00');}
function card(t){
  const [jt,ten]=joinTxt(t.join);
  const tags=[t.zh?'<span class="tag zh">中教</span>':'<span class="tag fr">外教</span>'];
  if(t.ft)tags.push('<span class="tag">全职</span>');if(t.t4)tags.push('<span class="tag">T4</span>');
  if(t.cert)tags.push('<span class="tag cert">高阶课程认证</span>');
  if(/考官/.test(t.exam))tags.push('<span class="tag cert">考官</span>');
  t.camps.forEach(c=>tags.push(`<span class="tag">${c}</span>`));
  if(!t.active)tags.unshift('<span class="tag" style="background:var(--ink);color:var(--paper)">目前不合作</span>');
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
  const dd=s=>s?`${+s.slice(5,7)}/${+s.slice(8)}`:'';
  const line=c=>`<div class="c">${c.code?`<span class="code">${esc(c.code)}</span>`:''}${c.name?`<span>${esc(c.name)}</span>`:''}${c.level?`<span class="lv">${esc(c.level)}</span>`:''}${c.form?`<span class="tag">${esc(c.form)}</span>`:''}
     <span class="meta">${[c.pre||'',c.days?'负责 '+c.days:'',c.sched?'班级 '+c.sched:(c.time||''),c.start&&c.until?'本阶段 '+dd(c.start)+'–'+dd(c.until):(c.until?'本阶段至 '+dd(c.until):'')].filter(Boolean).map(esc).join(' · ')}</span></div>`;
  const cls=t.cls.map(line).join('')+t.extra.map(x=>`<div class="c"><span>${esc(x.txt)}</span></div>`).join('');
  const nxt=t.nxt.map(n=>line({...n,until:'',start:'',pre:dd(n.start)+' 开始'})).join('');
  const ini=(t.name||'?').trim()[0].toUpperCase();
  return `<article class="card${t.active?'':' off'}">
    <div class="top"><div class="mono ${t.zh?'zh':''}">${t.photo?`<img src="${t.photo}" alt="${esc(t.name)}" loading="lazy">`:esc(ini)}</div>
      <div><div class="nm">${esc(t.name)}</div>${t.full?`<div class="full">${esc(t.full)}</div>`:''}</div>

    ${nxt?`<div class="cls"><h4>即将开始</h4>${nxt}</div>`:''}
  </article>`;}
function render(){
  const q=st.q.toLowerCase();

  if(q)L0=L0.filter(t=>JSON.stringify(t).toLowerCase().includes(q));

  L.sort(st.sort==='name'?(a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'}):(a,b)=>joinKey(a.join).localeCompare(joinKey(b.join))||a.name.localeCompare(b.name));
  let html='';
  if(!st.year&&st.sort==='join'){YEARS.forEach(y=>{const g=L.filter(t=>yearOf(t.join)===y);if(g.length)html+=`<h2 class="ysec">${y.includes('以前')?y+(st.act==='0'?'加入':'就在'):y+'加入'}<span>${g.length} 位</span></h2>`+g.map(card).join('');});}
  else html=L.map(card).join('');
  document.getElementById('grid').innerHTML=html||'<div class="empty">没有符合的老师</div>';
}
function stats(){const A=ACT,n=A.length,zh=A.filter(t=>t.zh).length,ex=A.filter(t=>/考官/.test(t.exam)).length,
  et=A.filter(t=>t.camps.includes('加东')).length,pt=A.filter(t=>t.camps.includes('加西')).length,
  cls=new Set(A.flatMap(t=>t.cls.filter(c=>c.code).map(c=>c.code))).size;
  document.getElementById('stats').innerHTML=[[n,'在职老师'],[n-zh,'外教'],[zh,'中教'],[ex,'具考官资格'],[et,'目前带加东班'],[pt,'目前带加西班'],[cls,'进行中的班级']]
   .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');}
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;render();});
[['fAct','act'],['fType','type'],['fCamp','camp'],['fSort','sort']].forEach(([id,k])=>document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  st[k]=b.dataset.v;[...b.parentNode.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();}));
document.getElementById('years').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.year=b.dataset.y;render();window.scrollTo({top:document.getElementById('years').offsetTop-10,behavior:'smooth'});});
stats();render();
</script>
</body>
</html>
